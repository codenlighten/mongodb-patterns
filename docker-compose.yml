# A single-node replica set: MongoDB only allows transactions on a replica set.
services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    # The tests create and drop many databases, and the server holds a file per collection and index.
    # With Docker's default limit it ran out ("Too many open files") and aborted after a few runs.
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    ports:
      - "127.0.0.1:${MONGO_PORT:-27027}:27017"
    healthcheck:
      # Initiates the replica set on the first check, then reports healthy once there is a primary.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) } quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 2s
      timeout: 10s
      retries: 30
